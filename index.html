<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanctum • Medical Dictionary</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
  
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    color: #1d1d1f;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .iphone-card {
    width: 100%;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border-radius: 40px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    padding: 40px 30px;
    text-align: center;
  }

  .app-icon {
    width: 100px;
    height: 100px;
    background: linear-gradient(135deg, #007AFF, #5856D6);
    border-radius: 22px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 45px;
    box-shadow: 0 10px 30px rgba(0, 122, 255, 0.4);
  }

  h1 {
    font-size: 32px;
    font-weight: 700;
    color: white;
    letter-spacing: -0.5px;
  }
  
  .subtitle {
    color: rgba(255,255,255,0.8);
    font-size: 16px;
    margin-bottom: 30px;
  }

  .glass-section {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 20px;
    margin: 20px 0;
    text-align: left;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .glass-section h3 {
    color: white;
    font-size: 18px;
    margin-bottom: 12px;
  }

  .feature {
    color: rgba(255,255,255,0.9);
    font-size: 15px;
    margin: 8px 0;
  }

  .download-btn {
    display: block;
    width: 100%;
    background: rgba(255, 255, 255, 0.95);
    color: #007AFF;
    padding: 16px;
    border-radius: 16px;
    text-decoration: none;
    font-weight: 600;
    font-size: 18px;
    margin-top: 25px;
    transition: all 0.3s;
    backdrop-filter: blur(10px);
  }
  
  .download-btn:hover {
    transform: scale(0.98);
    background: white;
  }

  .note {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    margin-top: 15px;
  }
</style>
</head>
<body>

  <div class="iphone-card">
    <div class="app-icon" style="color:#5597ff"><h2>℞</h2></div>
    
    <h1>Sanctum</h1>
    <p class="subtitle">Medical Dictionary</p>

    <div class="glass-section">
      <h3>Features</h3>
      <div class="feature">✓ 5000+ Medical  Terms</div>
      <div class="feature">✓ 100% Offline - No Internet Needed,but needs Internet to update terms when needed</div>
      <div class="feature">✓ Audio Pronunciation Of Terms</div>
  <div class="feature">✓ Adjustable Text Size</div>
  <div class="feature">✓ Clean Interface</div>
    </div>

    <a href="https://github.com/Readoneab25/Sanctum-Medical-Dictionary-/releases/download/v1.0/app-debug.apk" class="download-btn">
      Download for Android
    </a>
  </div>

</body>
</html>
